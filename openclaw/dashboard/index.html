<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Пульт жизни</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231f6f5c%27/%3E%3Cpath d=%27M9 21h14M9 15h9M9 9h14%27 stroke=%27white%27 stroke-width=%273%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a ledger page — summary strip on top, then three working columns (money, tasks, inbox) that stack on a phone. */
:root {
  --paper: #f3f5f2; --sheet: #ffffff; --ink: #1b2420; --muted: #5f6b66; --rule: #dfe4e0;
  --grid: rgba(27, 36, 32, 0.045); --accent: #1f6f5c; --accent-soft: #dcefe8;
  --good: #2f8a4c; --warn: #b7791f; --bad: #c2412d;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #121715; --sheet: #1a201e; --ink: #e6ece9; --muted: #95a39d; --rule: #2b3431;
    --grid: rgba(230, 236, 233, 0.035); --accent: #5cc7a8; --accent-soft: #1d3a32;
    --good: #5fc27d; --warn: #e0a44a; --bad: #ee7a66; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(24px, env(safe-area-inset-top, 0px)) max(48px, env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font: 700 clamp(22px, 4vw, 30px)/1.1 var(--display); margin: 0; letter-spacing: -0.01em; }
.date { font: 500 13px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.status { font-size: 13px; color: var(--muted); }
.status.err { color: var(--bad); }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
@media (max-width: 520px) { .strip { grid-template-columns: 1fr 1fr; } .tile .v { font-size: 20px; } }
.tile { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.tile .v { font: 600 24px/1.1 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile .s { font-size: 13px; color: var(--muted); }
.cols { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 980px) { .cols { grid-template-columns: 1fr 1fr; } .cols > :first-child { grid-column: 1 / -1; } }
@media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
section { background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
h2 { font: 500 15px var(--display); margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 small { font: 400 12px var(--mono); color: var(--muted); }
form { display: flex; flex-wrap: wrap; gap: 8px; }
input, select, button, textarea { font: inherit; color: inherit; }
input, select, textarea { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; min-width: 0; }
textarea { flex: 1 1 100%; resize: vertical; min-height: 64px; }
input:focus-visible, select:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input.grow { flex: 1 1 140px; }
input.amt { flex: 0 1 110px; font-family: var(--mono); }
button.add { background: var(--accent); color: var(--sheet); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
button.add:hover { filter: brightness(1.08); }
button.x { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 6px; font-size: 16px; line-height: 1; }
button.x:hover { color: var(--bad); background: var(--paper); }
.cats { display: grid; gap: 8px; }
.cat { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.cat .bar { height: 10px; background: var(--paper); border-radius: 5px; overflow: hidden; }
.cat .bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px; }
.cat b { font: 600 13px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
ul { list-style: none; margin: 0; padding: 0; display: grid; }
li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--rule); min-width: 0; }
li:first-child { border-top: 0; }
.grow1 { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--muted); }
.money { font: 600 14px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.late { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.done .grow1 { text-decoration: line-through; color: var(--muted); }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); padding: 0; flex: none; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; display: block; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.hint code { font: 12px var(--mono); background: var(--paper); padding: 1px 5px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="date" id="today">—</div>
      <h1>Пульт жизни</h1>
    </div>
    <div class="status" id="status">Загружаю…</div>
  </header>

  <div class="strip">
    <div class="tile"><span class="k">Потрачено за месяц</span><span class="v" id="t-spent">—</span><span class="s" id="t-spent-s"></span></div>
    <div class="tile"><span class="k">Сегодня</span><span class="v" id="t-today">—</span><span class="s" id="t-avg"></span></div>
    <div class="tile"><span class="k">Дела</span><span class="v" id="t-tasks">—</span><span class="s" id="t-tasks-s"></span></div>
    <div class="tile"><span class="k">Заметки</span><span class="v" id="t-notes">—</span><span class="s" id="t-notes-s"></span></div>
  </div>

  <div class="cols">
    <section aria-labelledby="h-money">
      <h2 id="h-money">Траты <small id="month-name"></small></h2>
      <form id="f-exp">
        <input class="amt" id="e-amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Сумма" required aria-label="Сумма">
        <select id="e-cat" aria-label="Категория"></select>
        <input class="grow" id="e-note" placeholder="На что (необязательно)" aria-label="Комментарий">
        <button class="add" type="submit">Добавить</button>
      </form>
      <div class="cats" id="cats"></div>
      <ul id="exp-list"></ul>
    </section>

    <section aria-labelledby="h-tasks">
      <h2 id="h-tasks">Что сделать <small id="tasks-count"></small></h2>
      <form id="f-task">
        <input class="grow" id="t-title" placeholder="Новое дело" required aria-label="Новое дело">
        <input id="t-due" type="date" aria-label="Срок">
        <button class="add" type="submit">Добавить</button>
      </form>
      <ul id="task-list"></ul>
    </section>

    <section aria-labelledby="h-notes">
      <h2 id="h-notes">Заметки <small>всё, что закинул</small></h2>
      <form id="f-note">
        <textarea id="n-text" placeholder="Мысль, ссылка, идея…" required aria-label="Новая заметка"></textarea>
        <button class="add" type="submit">Сохранить</button>
      </form>
      <ul id="note-list"></ul>
    </section>
  </div>
  <p class="hint">Пиши Джарвису в Telegram: «потратил 500 на такси», «надо оплатить интернет до пятницы», «запомни: …». Всё появится здесь само в течение 10 секунд.</p>
</div>

<script>
const CATS = ['Еда', 'Кафе', 'Транспорт', 'Дом', 'Связь и подписки', 'Развлечения', 'Здоровье', 'Одежда', 'Подарки', 'Другое'];
const SIGNS = { RUB: '₽', USD: '$', EUR: '€', KZT: '₸', BYN: 'Br', UAH: '₴' };
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const MONTHS = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const $ = id => document.getElementById(id);
let data = { expenses: [], tasks: [], notes: [], today: '' };
let lastJson = '';

const money = (n, cur) => `${Math.round(n).toLocaleString('ru-RU')} ${SIGNS[cur] || cur || ''}`.trim();
const short = d => d ? d.split('-').reverse().slice(0, 2).join('.') : '';
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
function setStatus(text, isErr) { const s = $('status'); s.textContent = text; s.classList.toggle('err', !!isErr); }

async function load() {
  try {
    const r = await fetch('/api/data', { cache: 'no-store' });
    if (!r.ok) throw new Error();
    const text = await r.text();
    if (text !== lastJson) { lastJson = text; data = JSON.parse(text); render(); }
    setStatus('Обновлено в ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }));
  } catch { setStatus('Нет связи с сервером', true); }
}
async function post(path, body) {
  try {
    const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) setStatus(j.error || 'Не сохранилось', true);
  } catch { setStatus('Нет связи с сервером', true); }
  await load();
}

$('e-cat').append(...CATS.map(c => el('option', { text: c })));

function sumByCurrency(rows) {
  const t = {};
  for (const e of rows) t[e.currency] = (t[e.currency] || 0) + e.amount;
  return Object.entries(t).sort((a, b) => b[1] - a[1]);
}

function render() {
  const today = data.today;
  const d = new Date(today + 'T12:00:00');
  $('today').textContent = `${WD[d.getDay()]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`;
  $('month-name').textContent = MONTHS[d.getMonth()];

  const month = data.expenses.filter(e => e.date.startsWith(today.slice(0, 7)));
  const totals = sumByCurrency(month);
  const main = totals[0] ? totals[0][0] : 'RUB';
  $('t-spent').textContent = totals.length ? money(totals[0][1], main) : money(0, 'RUB');
  $('t-spent-s').textContent = totals.length > 1 ? 'и ' + totals.slice(1).map(([c, v]) => money(v, c)).join(', ') : `${month.length} записей`;
  const todaySum = month.filter(e => e.date === today && e.currency === main).reduce((s, e) => s + e.amount, 0);
  $('t-today').textContent = money(todaySum, main);
  $('t-avg').textContent = `в среднем ${money((totals[0] ? totals[0][1] : 0) / d.getDate(), main)} в день`;

  const byCat = {};
  for (const e of month.filter(e => e.currency === main)) byCat[e.category] = (byCat[e.category] || 0) + e.amount;
  const catRows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const max = catRows[0] ? catRows[0][1] : 1;
  $('cats').replaceChildren(...catRows.map(([c, v]) => el('div', { class: 'cat' },
    el('span', { text: c }), el('div', { class: 'bar' }, el('i', { style: `width:${v / max * 100}%` })), el('b', { text: money(v, main) }))));

  const recent = [...data.expenses].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0, 15);
  $('exp-list').replaceChildren(...(recent.length ? recent.map(e => el('li', {},
    el('div', { class: 'grow1' }, el('div', { text: e.note || e.category }), el('div', { class: 'meta', text: `${e.category} · ${short(e.date)}` })),
    el('span', { class: 'money', text: money(e.amount, e.currency) }),
    el('button', { class: 'x', 'aria-label': 'Удалить трату', title: 'Удалить', text: '×', onclick: () => post('/api/expenses/delete', { id: e.id, date: e.date, amount: e.amount }) })))
    : [el('li', {}, el('span', { class: 'empty', text: 'Трат пока нет. Скажи Джарвису «потратил 300 на кофе» или впиши сумму сверху.' }))]));

  const tasks = [...data.tasks].sort((a, b) => (a.done - b.done) || (a.due || '9').localeCompare(b.due || '9') || a.line - b.line);
  const open = tasks.filter(t => !t.done);
  const late = open.filter(t => t.due && t.due < today);
  $('t-tasks').textContent = String(open.length);
  $('t-tasks-s').textContent = open.length ? (late.length ? `просрочено: ${late.length}` : 'всё в срок') : 'открытых дел нет';
  $('tasks-count').textContent = `${open.length} открыто`;
  $('task-list').replaceChildren(...(tasks.length ? tasks.map(t => {
    const isLate = !t.done && t.due && t.due < today;
    return el('li', { class: t.done ? 'done' : '' },
      el('input', { type: 'checkbox', 'aria-label': 'Готово', ...(t.done ? { checked: '' } : {}), onchange: () => post('/api/tasks/toggle', { line: t.line, raw: t.raw }) }),
      el('div', { class: 'grow1', text: t.title }),
      t.due ? el('span', { class: 'chip' + (isLate ? ' late' : ''), text: t.due === today ? 'сегодня' : short(t.due) }) : null,
      el('button', { class: 'x', 'aria-label': 'Удалить дело', title: 'Удалить', text: '×', onclick: () => post('/api/tasks/delete', { line: t.line, raw: t.raw }) }));
  }) : [el('li', {}, el('span', { class: 'empty', text: 'Дел пока нет. Скажи Джарвису «надо …» или запиши сверху.' }))]));

  const notes = [...data.notes].reverse();
  $('t-notes').textContent = String(notes.length);
  $('t-notes-s').textContent = notes[0] ? `последняя ${short(notes[0].date)} ${notes[0].time}` : 'пока пусто';
  $('note-list').replaceChildren(...(notes.length ? notes.slice(0, 30).map(n => el('li', {},
    el('div', { class: 'grow1' }, el('div', { text: n.text }), el('div', { class: 'meta', text: `${short(n.date)} ${n.time}` })),
    el('button', { class: 'x', 'aria-label': 'Удалить заметку', title: 'Удалить', text: '×', onclick: () => post('/api/notes/delete', { line: n.line, raw: n.raw }) })))
    : [el('li', {}, el('span', { class: 'empty', text: 'Скажи Джарвису «запомни: …» или кинь ссылку, и она будет здесь.' }))]));
}

$('f-exp').addEventListener('submit', ev => {
  ev.preventDefault();
  const amount = parseFloat($('e-amt').value);
  if (!(amount > 0)) return;
  const body = { amount, category: $('e-cat').value, note: $('e-note').value.trim() };
  $('e-amt').value = ''; $('e-note').value = '';
  post('/api/expenses/add', body);
});
$('f-task').addEventListener('submit', ev => {
  ev.preventDefault();
  const title = $('t-title').value.trim(); if (!title) return;
  const body = { title, due: $('t-due').value };
  $('t-title').value = ''; $('t-due').value = '';
  post('/api/tasks/add', body);
});
$('f-note').addEventListener('submit', ev => {
  ev.preventDefault();
  const text = $('n-text').value.trim(); if (!text) return;
  $('n-text').value = '';
  post('/api/notes/add', { text });
});

load();
setInterval(() => { if (!document.hidden) load(); }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
